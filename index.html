<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#185FA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="출석체크">
<title>출석체크</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root {
  --blue:#185FA5; --blue-bg:#E6F1FB;
  --present-bg:#E1F5EE; --present-bd:#1D9E75; --present-tx:#085041; --present-badge:#0F6E56;
  --absent-bg:#FCEBEB;  --absent-bd:#E24B4A;  --absent-tx:#501313;  --absent-badge:#A32D2D;
  --late-bg:#FAEEDA;    --late-bd:#EF9F27;    --late-tx:#412402;    --late-badge:#854F0B;
  --early-bg:#EDE7F6; --early-bd:#7E57C2; --early-tx:#311B92; --early-badge:#512DA8;
  --surf:#fff; --surf2:#F8F7F4;
  --bd:rgba(0,0,0,.10); --bd2:rgba(0,0,0,.18);
  --tx:#1a1a18; --tx2:#5F5E5A; --tx3:#888780;
  --r:10px; --rlg:14px;
  --shlg:0 8px 32px rgba(0,0,0,.16);
}
@media(prefers-color-scheme:dark){:root{
  --surf:#1c1c1a; --surf2:#252523;
  --bd:rgba(255,255,255,.10); --bd2:rgba(255,255,255,.18);
  --tx:#f0eeea; --tx2:#B4B2A9; --tx3:#888780;
  --blue-bg:#0C447C;
  --present-bg:#04342C; --present-bd:#0F6E56; --present-tx:#9FE1CB;
  --absent-bg:#501313;  --absent-bd:#A32D2D;  --absent-tx:#F7C1C1;
  --late-bg:#412402;    --late-bd:#854F0B;    --late-tx:#FAC775;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--surf2);color:var(--tx)}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:var(--surf);border-bottom:.5px solid var(--bd);padding:0 16px;padding-top:env(safe-area-inset-top)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;height:52px}
.hdr-title{font-size:17px;font-weight:700}
.hdr-date{font-size:12px;color:var(--tx2);margin-top:1px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:.5px solid var(--bd2);background:var(--surf2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);font-size:18px}

/* SESSION TABS */
.session-tabs{display:flex}
.session-tab{flex:1;padding:10px 0;font-size:13px;font-weight:600;text-align:center;border:none;background:transparent;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.session-tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* CLASS TABS */
.class-tabs-wrap{display:flex;align-items:center;gap:6px;padding:8px 0 10px;overflow-x:auto;scrollbar-width:none}
.class-tabs-wrap::-webkit-scrollbar{display:none}
.class-tab{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:500;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx2);cursor:pointer;white-space:nowrap}
.class-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.add-tab-btn{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px dashed var(--bd2);background:transparent;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px;background:var(--surf);border-bottom:.5px solid var(--bd);position:sticky;top:0;z-index:49}
.stat-item{text-align:center}
.stat-num{font-size:22px;font-weight:700;line-height:1}
.stat-label{font-size:11px;color:var(--tx3);margin-top:2px}
.s-total .stat-num{color:var(--tx)}
.s-present .stat-num{color:var(--present-badge)}
.s-absent .stat-num{color:var(--absent-badge)}
.s-late .stat-num{color:var(--late-badge)}

/* ACTION BAR */
.action-bar{background:var(--surf);border-bottom:.5px solid var(--bd);padding:10px 16px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:48}
.all-present-btn{width:100%;padding:11px;border-radius:10px;border:none;background:var(--present-badge);color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .12s}
.all-present-btn:active{opacity:.85}
.mode-row{display:flex;align-items:center;gap:8px}
.mode-label{font-size:12px;color:var(--tx3);white-space:nowrap;flex-shrink:0}
.mode-btns{display:flex;gap:6px;flex:1}
.mode-btn{flex:1;padding:8px 4px;border-radius:8px;border:2px solid var(--bd);background:var(--surf2);color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer;text-align:center;white-space:nowrap;transition:all .12s}
.mode-btn.mode-present.active{background:var(--present-bg);border-color:var(--present-bd);color:var(--present-tx)}
.mode-btn.mode-absent.active{background:var(--absent-bg);border-color:var(--absent-bd);color:var(--absent-tx)}
.mode-btn.mode-late.active{background:var(--late-bg);border-color:var(--late-bd);color:var(--late-tx)}
.mode-btn.mode-early.active{background:var(--early-bg);border-color:var(--early-bd);color:var(--early-tx)}
.mode-div{width:1px;height:26px;background:var(--bd2);flex-shrink:0}
.reset-btn{font-size:11px;padding:5px 9px;border-radius:6px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx2);cursor:pointer;white-space:nowrap;flex-shrink:0}
/* 날짜 선택 */
.date-selector-wrap{display:flex;align-items:center;gap:6px;padding:6px 16px 8px}
.date-nav-btn{width:30px;height:30px;border-radius:8px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.date-display{flex:1;height:30px;border-radius:8px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
.date-display.today{background:var(--blue);color:#fff;border-color:var(--blue)}

/* 지각 통계 모달 */
.late-stats-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
.late-stats-overlay.show{display:flex}
.late-stats-sheet{background:var(--surf);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);animation:slideUp .2s ease}
.ls-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:.5px solid var(--bd);position:sticky;top:0;background:var(--surf)}
.ls-title{font-size:16px;font-weight:700}
.ls-body{padding:12px 16px}
.ls-date-section{margin-bottom:14px}
.ls-date-label{font-size:12px;color:var(--tx3);font-weight:700;margin-bottom:6px;padding:4px 8px;background:var(--surf2);border-radius:6px;display:inline-block}
.ls-student-row{display:flex;align-items:center;padding:7px 10px;border-radius:8px;margin-bottom:4px;background:var(--late-bg);border:.5px solid var(--late-bd)}
.ls-student-num{font-size:11px;color:var(--late-tx);width:24px;flex-shrink:0;opacity:.7}
.ls-student-name{flex:1;font-size:14px;font-weight:600;color:var(--late-tx)}
.ls-student-memo{font-size:12px;color:var(--late-badge);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls-count-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--late-badge);color:#fff;margin-left:6px}
.ls-empty{text-align:center;padding:24px;color:var(--tx3);font-size:13px}
.ls-summary{display:flex;gap:8px;margin-bottom:14px}
.ls-sum-card{flex:1;background:var(--surf2);border-radius:10px;padding:10px;text-align:center}
.ls-sum-num{font-size:22px;font-weight:700;color:var(--late-badge)}
.ls-sum-label{font-size:11px;color:var(--tx3);margin-top:2px}

/* 메모 힌트 */
.memo-hint{font-size:10px;color:var(--tx3);text-align:right;padding:0 2px 2px}

/* PWA 설치 배너 */
.pwa-banner{display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--blue);color:#fff}
.pwa-banner.show{display:flex}
.pwa-banner-icon{font-size:22px;flex-shrink:0}
.pwa-banner-text{flex:1;font-size:13px;font-weight:600;line-height:1.3}
.pwa-banner-sub{font-size:11px;opacity:.8;font-weight:400}
.pwa-install-btn{padding:7px 14px;border-radius:8px;border:none;background:#fff;color:var(--blue);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.pwa-close-btn{width:26px;height:26px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}

/* STUDENT GRID */
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;padding:12px 16px 100px}
@media(min-width:600px){.student-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}

.student-card{background:var(--surf);border:.5px solid var(--bd);border-radius:var(--r);padding:10px 8px 8px;text-align:center;cursor:pointer;transition:transform .1s;user-select:none;position:relative}
.student-card:active{transform:scale(.96)}
.student-card.present{background:var(--present-bg);border-color:var(--present-bd)}
.student-card.absent{background:var(--absent-bg);border-color:var(--absent-bd)}
.student-card.late{background:var(--late-bg);border-color:var(--late-bd)}

.card-num{font-size:10px;color:var(--tx3);margin-bottom:2px}
.card-name{font-size:14px;font-weight:600;color:var(--tx);line-height:1.2}
.student-card.present .card-name{color:var(--present-tx)}
.student-card.absent .card-name{color:var(--absent-tx)}
.student-card.late .card-name{color:var(--late-tx)}

.card-badge{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bd);color:var(--tx3)}
.student-card.present .card-badge{background:var(--present-badge);color:#fff}
.student-card.absent .card-badge{background:var(--absent-badge);color:#fff}
.student-card.late .card-badge{background:var(--late-badge);color:#fff}

/* 사유 메모 표시 */
.student-card.early{background:var(--early-bg);border-color:var(--early-bd)}
.student-card.early .card-name{color:var(--early-tx)}
.student-card.early .card-badge{background:var(--early-badge);color:#fff}
.card-memo{font-size:10px;color:var(--tx3);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding:0 2px;line-height:1.3;word-break:break-all}
.student-card.absent .card-memo{color:var(--absent-tx);opacity:.85}
.student-card.late .card-memo{color:var(--late-tx);opacity:.85}
.student-card.early .card-memo{color:var(--early-tx);opacity:.85}
.memo-student-status.early{background:var(--early-badge);color:#fff}
/* 메모 있을 때 연필 아이콘 */
.card-memo-icon{position:absolute;top:6px;right:6px;font-size:10px;color:var(--tx3);opacity:.5}
.student-card.absent .card-memo-icon,.student-card.late .card-memo-icon{color:var(--tx3);opacity:.6}

/* BOTTOM BAR */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:.5px solid var(--bd);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:40}
.url-input{flex:1;height:40px;border-radius:8px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx);font-size:12px;padding:0 10px;min-width:0;font-family:inherit}
.btn-load{height:40px;width:40px;border-radius:8px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .1s}
.btn-load:active{background:var(--bd)}
.btn-load i{transition:transform .5s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-save{height:40px;padding:0 18px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;flex-shrink:0}
.btn-save:disabled{background:#ccc;color:#888}

/* MEMO MODAL (결석/지각 사유) */
.memo-overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
.memo-overlay.show{display:flex}
.memo-sheet{background:var(--surf);border-radius:20px 20px 0 0;padding:0;width:100%;max-width:480px;box-shadow:var(--shlg);animation:slideUp .2s ease;padding-bottom:env(safe-area-inset-bottom)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.memo-handle{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:10px auto 0}
.memo-student{text-align:center;padding:14px 16px 0}
.memo-student-name{font-size:17px;font-weight:700}
.memo-student-status{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.memo-student-status.absent{background:var(--absent-badge);color:#fff}
.memo-student-status.late{background:var(--late-badge);color:#fff}
.memo-body{padding:14px 16px 0}
.memo-label{font-size:12px;color:var(--tx3);margin-bottom:6px;font-weight:600}
.memo-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.memo-preset{padding:6px 12px;border-radius:20px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx2);font-size:13px;cursor:pointer}
.memo-preset:active{background:var(--bd)}
.memo-textarea{width:100%;padding:10px 12px;border-radius:10px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx);font-size:14px;font-family:inherit;resize:none;height:72px}
.memo-footer{display:flex;gap:8px;padding:12px 16px 14px}
.memo-clear{flex:1;padding:12px;border-radius:10px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx2);font-size:14px;font-weight:600;cursor:pointer}
.memo-save{flex:2;padding:12px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer}

/* MODAL (공통) */
.modal-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--surf);border-radius:var(--rlg);padding:20px;width:100%;max-width:360px;box-shadow:var(--shlg)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px}
.modal-sub{font-size:12px;color:var(--tx3);margin-bottom:5px}
.modal-input,.modal-textarea{width:100%;padding:10px 12px;border-radius:8px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx);font-size:14px;font-family:inherit;margin-bottom:10px}
.modal-textarea{height:130px;resize:vertical}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn-cancel{padding:9px 16px;border-radius:8px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx2);font-size:14px;cursor:pointer}
.btn-confirm{padding:9px 18px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer}

/* STUDENT MANAGE */
.sm-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;margin-bottom:10px}
.sm-row{display:flex;align-items:center;gap:8px;padding:7px 8px;background:var(--surf2);border-radius:6px;border:.5px solid var(--bd)}
.sm-num{font-size:11px;color:var(--tx3);width:20px;text-align:right;flex-shrink:0}
.sm-name{flex:1;font-size:14px}
.sm-del{width:26px;height:26px;border-radius:6px;border:none;background:var(--absent-bg);color:var(--absent-badge);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.add-row{display:flex;gap:6px}
.add-input{flex:1;padding:8px 10px;border-radius:8px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx);font-size:14px;font-family:inherit}
.add-btn{padding:8px 14px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer}

/* SETTINGS */
.settings-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.35)}
.settings-overlay.show{display:block}
.settings-panel{position:fixed;top:0;right:0;bottom:0;width:min(320px,90vw);background:var(--surf);box-shadow:var(--shlg);overflow-y:auto;animation:slideR .2s ease;z-index:501}
@keyframes slideR{from{transform:translateX(100%)}to{transform:translateX(0)}}
.sp-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));border-bottom:.5px solid var(--bd)}
.sp-title{font-size:16px;font-weight:700}
.sp-sec{padding:14px 16px;border-bottom:.5px solid var(--bd)}
.sp-label{font-size:11px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sbadge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.sbadge-m{background:#FFF3CD;color:#856404}
.sbadge-c{background:#D1ECF1;color:#0C5460}
.sp-url{width:100%;padding:10px 12px;border-radius:8px;border:.5px solid var(--bd2);background:var(--surf2);color:var(--tx);font-size:13px;font-family:inherit;margin-bottom:8px}
.cm-list{display:flex;flex-direction:column;gap:6px}
.cm-item{display:flex;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surf2);border:.5px solid var(--bd);gap:8px}
.cm-info{flex:1}
.cm-name{font-size:14px;font-weight:600}
.cm-meta{font-size:11px;color:var(--tx3);margin-top:1px}
.cm-btns{display:flex;gap:5px}
.cm-edit{width:28px;height:28px;border-radius:6px;border:none;background:var(--blue-bg);color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.cm-del{width:28px;height:28px;border-radius:6px;border:none;background:var(--absent-bg);color:var(--absent-badge);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.sp-add-btn{width:100%;padding:10px;border-radius:8px;border:1px dashed var(--bd2);background:transparent;color:var(--tx2);font-size:14px;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#1a1a18;color:#f0eeea;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;pointer-events:none;z-index:999;transition:all .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--present-badge)}
.toast.err{background:var(--absent-badge)}
.empty-state{grid-column:1/-1;text-align:center;padding:40px 0;color:var(--tx3);font-size:14px;line-height:2}
</style>
</head>
<body>

<!-- STICKY WRAP: 헤더 + 통계 + 액션바 전체 고정 -->
<div style="position:sticky;top:0;z-index:50;background:var(--surf)">

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-top">
    <div>
      <div class="hdr-title">출석체크</div>
      <div class="hdr-date" id="headerDate"></div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="icon-btn" onclick="openLateStats()" id="lateStatsBtn" title="지각 통계" style="display:none"><i class="ti ti-chart-bar"></i></button>
      <button class="icon-btn" onclick="openSettings()"><i class="ti ti-settings"></i></button>
    </div>
  </div>
  <!-- 날짜 선택 -->
  <div class="date-selector-wrap">
    <button class="date-nav-btn" onclick="moveDate(-1)"><i class="ti ti-chevron-left"></i></button>
    <button class="date-display" id="dateDisplay" onclick="openDatePicker()"></button>
    <button class="date-nav-btn" onclick="moveDate(1)" id="dateNextBtn"><i class="ti ti-chevron-right"></i></button>

        앱 데이터 완전 초기화 (반 명단 포함)

      <button class="sp-add-btn" onclick="openAddClassModal('morning')"><i class="ti ti-plus"></i> 반 추가</button>
    </div>
    <div class="sp-sec">
      <div class="sp-label">수업 반 <span class="sbadge sbadge-c">수업</span></div>
      <div class="cm-list" id="cmClass"></div>

<div class="toast" id="toast"></div>

<script>
const LABEL = {present:'출석', absent:'결석', late:'지각', early:'조퇴'};

// ── Apps Script URL (고정) ──
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7tE-s30OYYpaZ8BkYAUAVgka865m3mAGV_YNlvJ-NyuEwDeBeuRX8Ng_xrBeQ-dSx/exec';
function getUrl() { return localStorage.getItem('scriptUrl') || SCRIPT_URL; }

const PRESETS = {
  absent: ['질병','인정','기타'],
  late:   ['질병','인정','기타'],
  early:  ['질병','인정','기타']
};

const DEFAULT_DATA = {
  morning: {
    '3-1(아침자습)': ['김가연','김나연','김은서','김지윤','문설화','이봄','이혜윤','정예은','진예솜','강태윤','김주현','김하진','나호연','류성현','문보검','박노윤','백인우','서영재','유건우','윤유섭','이시형','이유찬','이준규','전영재','정승호','한유찬','홍성주']
  },
  class: {
    '과탐실 1-1':[],'과탐실 1-2':[],'과탐실 1-3':[],
    '과탐실 1-4':[],'과탐실 1-5':[],'과탐실 1-6':[],
    '3-1(화학)':[],'3-6(화학)':[],'3-7(화학)':[]
  }
};

let D = {morning:{}, class:{}};
let A = {morning:{}, class:{}};
let M = {morning:{}, class:{}};
let ses = 'morning', cur = '', mode = 'present';
let editSes='', editCls='', addSes='morning';
let memoIdx = -1;
let syncTimer = null;

// ── 날짜 관리 ──
let selectedDate = new Date(); // 선택된 날짜 (Date 객체)

function dateToKey(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function isToday(d) {
  const t = new Date();
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}
function todayKey() { return dateToKey(selectedDate); }

function updateDateUI() {
  const today = isToday(selectedDate);
  const label = today
    ? `오늘 (${dateToKey(selectedDate)})`
    : selectedDate.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
  const btn = document.getElementById('dateDisplay');
  btn.textContent = label;
  btn.classList.toggle('today', today);
  // 오늘 이후면 다음 버튼 비활성화
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  document.getElementById('dateNextBtn').disabled = selectedDate >= tomorrow;
}

function moveDate(delta) {
  const d = new Date(selectedDate);
  d.setDate(d.getDate() + delta);
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  if (d >= tomorrow) return;
  selectedDate = d;
  updateDateUI();
  syncFromSheet();
}

function openDatePicker() {
  const picker = document.getElementById('datePicker');
  const y = selectedDate.getFullYear();
  const m = String(selectedDate.getMonth()+1).padStart(2,'0');
  const day = String(selectedDate.getDate()).padStart(2,'0');
  picker.value = `${y}-${m}-${day}`;
  picker.max = new Date().toISOString().slice(0,10);
  picker.click();
}

function onDatePick(val) {
  if (!val) return;
  selectedDate = new Date(val + 'T00:00:00');
  updateDateUI();
  syncFromSheet();
}

// ── INIT ──
function init() {
  const d = new Date();
  document.getElementById('headerDate').textContent =
    d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  load();
  document.getElementById('settingsUrl').value = localStorage.getItem('scriptUrl') || SCRIPT_URL;
  updateDateUI();
  updateModeUI();
  renderTabs();
  renderGrid();
  // 아침자습일 때만 지각통계 버튼 표시
  updateLateStatsBtn();
  // 오늘이면 시트에서 불러오기, 날짜 바뀌었으면 초기화만 (🔄 버튼으로 수동 불러오기)
  const savedDate = (() => { try { return JSON.parse(localStorage.getItem('att5')||'{}').savedDate||''; } catch{ return ''; } })();
  const today = new Date().toISOString().slice(0,10);
  if (savedDate === today) syncFromSheet();
}

function updateLateStatsBtn() {
  document.getElementById('lateStatsBtn').style.display = ses==='morning' ? 'flex' : 'none';
}

// ── STORAGE ──
function save() {
  try {
    localStorage.setItem('att5', JSON.stringify({
      D, A, M,
      savedDate: new Date().toISOString().slice(0,10),
      ses, cur
    }));
  } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem('att5');
    if (!raw) { reset(); return; }
    const s = JSON.parse(raw);
    D = s.D || JSON.parse(JSON.stringify(DEFAULT_DATA));
    ses = s.ses || 'morning';

    // D가 비어있으면 DEFAULT로 채우기
    if (!Object.keys(D.morning||{}).length) D.morning = JSON.parse(JSON.stringify(DEFAULT_DATA.morning));
    if (!Object.keys(D.class||{}).length)   D.class   = JSON.parse(JSON.stringify(DEFAULT_DATA.class));

    const today = new Date().toISOString().slice(0,10);
    if (s.savedDate && s.savedDate !== today) {
      // 날짜 바뀌면 출석+사유 전체 초기화 (명단은 유지)
      A = {morning:{}, class:{}};
      M = {morning:{}, class:{}};
      // 초기화된 상태로 저장 (앱 재시작해도 다시 초기화 안 되게)
      setTimeout(()=>{
        save();
        toast('새 날짜 — 출석 자동 초기화 ✓','ok');
      }, 300);
    } else {
      A = s.A || {morning:{}, class:{}};
      M = s.M || {morning:{}, class:{}};
    }
    ['morning','class'].forEach(x=>{ if(!D[x])D[x]={}; if(!A[x])A[x]={}; if(!M[x])M[x]={}; });
    const list = Object.keys(D[ses]);
    cur = list.includes(s.cur) ? s.cur : (list[0]||'');
  } catch(e) { reset(); }
}

function reset() {
  D = JSON.parse(JSON.stringify(DEFAULT_DATA));
  A = {morning:{}, class:{}}; M = {morning:{}, class:{}};
  ses = 'morning'; cur = Object.keys(D.morning)[0];
}

// ── SESSION ──
function switchSession(s) {
  ses = s;
  ['morning','class'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===s));
  cur = Object.keys(D[ses])[0]||'';
  mode = 'present'; updateModeUI();
  updateLateStatsBtn();
  renderTabs(); renderGrid(); save();
  syncFromSheet();
}

// ── TABS ──
function renderTabs() {
  document.getElementById('classTabs').innerHTML =
    Object.keys(D[ses]).map(c=>
      `<button class="class-tab${c===cur?' active':''}" onclick="switchClass('${esc(c)}')">${c}</button>`
    ).join('') +
    `<button class="add-tab-btn" onclick="openAddClassModal('${ses}')"><i class="ti ti-plus"></i></button>`;
}
function switchClass(c) { cur=c; renderTabs(); renderGrid(); save(); syncFromSheet(); }

// ── GRID ──
function renderGrid() {
  const grid = document.getElementById('studentGrid');
  const students = D[ses]?.[cur]||[];
  if (!students.length) {
    grid.innerHTML=`<div class="empty-state">학생이 없어요.<br>설정 → 반 편집에서 학생을 추가하세요.</div>`;
    updateStats(); return;
  }
  if (!A[ses]) A[ses]={}; if (!M[ses]) M[ses]={};
  grid.innerHTML = students.map((name,i)=>{
    if (!name) return `<div class="student-card" id="c${i}" style="opacity:.3;cursor:default;border-style:dashed">
      <div class="card-num">${String(i+1).padStart(2,'0')}</div>
      <div class="card-name" style="font-size:11px;color:var(--tx3)">결번</div>
      <div class="card-badge">-</div>
    </div>`;
    const st = A[ses]?.[cur]?.[i]||'';
    const memo = M[ses]?.[cur]?.[i]||'';
    const hasMemo = memo && st && st!=='present';
    const {num, name: displayName} = parseName(name);
    return `<div class="student-card ${st}" id="c${i}">
      ${hasMemo?`<i class="card-memo-icon ti ti-pencil"></i>`:''}
      <div class="card-num">${String(i+1).padStart(2,'0')}${num?` <span style="font-size:9px;opacity:.7">${num}</span>`:''}</div>
      <div class="card-name">${displayName}</div>
      <div class="card-badge">${LABEL[st]||'미입력'}</div>
      ${st&&st!=='present'?`<div class="card-memo">${memo||''}</div>`:''}
    </div>`;
  }).join('');

  // 이벤트 부착 (longpress + 우클릭) - 결번 제외
  students.forEach((name,i) => {
    if (!name) return; // 결번 스킵
    const card = document.getElementById('c'+i);
    if (!card) return;
    card.addEventListener('click', ()=>tap(i));
    card.addEventListener('contextmenu', e=>{ e.preventDefault(); openMemo(i); });
    let lt;
    card.addEventListener('touchstart', ()=>{ lt=setTimeout(()=>openMemo(i), 500); }, {passive:true});
    card.addEventListener('touchend', ()=>clearTimeout(lt));
    card.addEventListener('touchmove', ()=>clearTimeout(lt));
  });
  updateStats();
}

function updateCard(i) {
  const card = document.getElementById('c'+i);
  if (!card) return;
  const st = A[ses]?.[cur]?.[i]||'';
  const memo = M[ses]?.[cur]?.[i]||'';
  const hasMemo = memo && st && st!=='present';
  const rawName = D[ses]?.[cur]?.[i]||'';
  const {num, name: displayName} = parseName(rawName);
  card.className = `student-card ${st}`;
  card.innerHTML = `
    ${hasMemo?`<i class="card-memo-icon ti ti-pencil"></i>`:''}
    <div class="card-num">${String(i+1).padStart(2,'0')}${num?` <span style="font-size:9px;opacity:.7">${num}</span>`:''}</div>
    <div class="card-name">${displayName}</div>
    <div class="card-badge">${LABEL[st]||'미입력'}</div>
    ${st&&st!=='present'?`<div class="card-memo">${memo||''}</div>`:''}
  `;
  // 기존 이벤트 완전 제거 후 새로 부착
  const newCard = card.cloneNode(true);
  card.parentNode.replaceChild(newCard, card);
  newCard.onclick = ()=>tap(i);
  newCard.oncontextmenu = e=>{ e.preventDefault(); openMemo(i); };
  let lt;
  newCard.addEventListener('touchstart', ()=>{ lt=setTimeout(()=>openMemo(i), 500); }, {passive:true});
  newCard.addEventListener('touchend', ()=>clearTimeout(lt));
  newCard.addEventListener('touchmove', ()=>clearTimeout(lt));
}

function updateStats() {
  const students = D[ses]?.[cur]||[];
  const a = A[ses]?.[cur]||{};
  let total=0, p=0, ab=0, la=0, ea=0;
  students.forEach((name,i)=>{
    if (!name) return;
    total++;
    if(a[i]==='present')p++;
    else if(a[i]==='absent')ab++;
    else if(a[i]==='late')la++;
    else if(a[i]==='early')ea++;
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPresent').textContent = p;
  document.getElementById('statAbsent').textContent = ab;
  document.getElementById('statLate').textContent = la + (ea>0?`+${ea}`:'');
}

// ── 전체 출석 ──
function allPresent() {
  const students = D[ses]?.[cur]||[];
  if (!A[ses]) A[ses]={};
  if (!A[ses][cur]) A[ses][cur]={};
  students.forEach((name,i)=>{ 
    if(name) A[ses][cur][i]='present';
  });
  save(); renderGrid(); toast('전체 출석 처리 ✓','ok');
}

// ── MODE ──
function setMode(m) { mode=m; updateModeUI(); }
function updateModeUI() {
  document.getElementById('modePresent').classList.toggle('active', mode==='present');
  document.getElementById('modeAbsent').classList.toggle('active', mode==='absent');
  document.getElementById('modeLate').classList.toggle('active', mode==='late');
  document.getElementById('modeEarly').classList.toggle('active', mode==='early');
}

// ── 카드 탭 ──
// 출석 모드: 탭 → 바로 변경
// 결석/지각/조퇴 모드: 
//   - 미입력/출석 카드 탭 → 바로 변경
//   - 이미 결석/지각/조퇴 카드 탭 → 사유 팝업 (취소=유지, 사유없음=출석으로)
function tap(i) {
  if (!A[ses]) A[ses]={};
  if (!A[ses][cur]) A[ses][cur]={};
  const prev = A[ses][cur][i] || '';

  if (prev === mode && mode !== 'present') {
    delete A[ses][cur][i];
    if (M[ses]?.[cur]) delete M[ses][cur][i];
  } else if (prev === mode && mode === 'present') {
    return;
  } else {
    A[ses][cur][i] = mode;
    if (mode === 'present' && M[ses]?.[cur]) delete M[ses][cur][i];
  }
  updateCard(i); updateStats(); save();
}
  
// ── 사유 메모 ──
function openMemo(i) {
  const st = A[ses]?.[cur]?.[i]||'';
  if (!st || st === 'present') {
    toast('결석·지각·조퇴 상태일 때 사유를 입력할 수 있어요','err'); return;
  }
  memoIdx = i;
  const name = D[ses]?.[cur]?.[i]||'';
  const curMemo = M[ses]?.[cur]?.[i]||'';
  const {name: displayName} = parseName(name);
  document.getElementById('memoName').textContent = displayName;
  const statusEl = document.getElementById('memoStatus');
  statusEl.textContent = LABEL[st];
  statusEl.className = `memo-student-status ${st}`;
  const presets = PRESETS[st]||[];
  document.getElementById('memoPresets').innerHTML = presets.map(p=>
    `<button class="memo-preset" onclick="selectPreset('${p}')">${p}</button>`
  ).join('');
  document.getElementById('memoText').value = curMemo;
  document.getElementById('memoOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('memoText').focus(), 300);
}

function selectPreset(p) {
  const ta = document.getElementById('memoText');
  ta.value = p; ta.focus();
}

function saveMemo() {
  const text = document.getElementById('memoText').value.trim();
  if (!M[ses]) M[ses]={}; if (!M[ses][cur]) M[ses][cur]={};
  M[ses][cur][memoIdx] = text;
  closeMemo(); updateCard(memoIdx); save();
}

function clearMemo() {
  // 사유없음 = 출석으로 변경
  if (!A[ses]) A[ses]={}; if (!A[ses][cur]) A[ses][cur]={};
  A[ses][cur][memoIdx] = 'present';
  if (M[ses]?.[cur]) delete M[ses][cur][memoIdx];
  document.getElementById('memoText').value='';
  closeMemo(); updateCard(memoIdx); updateStats(); save();
  toast('출석으로 변경됨');
}

function closeMemo() {
  document.getElementById('memoOverlay').classList.remove('show');
  memoIdx = -1;
}

function resetAll() {
  A[ses][cur]={}; M[ses][cur]={};
  renderGrid(); save(); toast('초기화');
}

// ── 반 추가 ──
function openAddClassModal(s) {
  addSes=s;
  document.getElementById('addClassTitle').textContent=(s==='morning'?'아침자습':'수업')+' 반 추가';
  document.getElementById('newClassName').value='';
  document.getElementById('newStudentList').value='';
  document.getElementById('addClassModal').classList.add('show');
  setTimeout(()=>document.getElementById('newClassName').focus(),100);
}
function closeAddModal() { document.getElementById('addClassModal').classList.remove('show'); }
function confirmAddClass() {
  const name = document.getElementById('newClassName').value.trim();
  if (!name) { toast('반 이름 입력','err'); return; }
  const students = document.getElementById('newStudentList').value.trim().split('\n').map(s=>s.trim()).filter(Boolean);
  if (!D[addSes]) D[addSes]={};
  D[addSes][name] = students;
  if (!A[addSes]) A[addSes]={}; if (!A[addSes][name]) A[addSes][name]={};
  if (!M[addSes]) M[addSes]={}; if (!M[addSes][name]) M[addSes][name]={};
  closeAddModal();
  if (addSes===ses) { cur=name; renderTabs(); renderGrid(); }
  renderCmLists(); save(); toast(`${name} 추가`,'ok');
}

// ── 학생 편집 ──
function openEditModal(s,c) {
  editSes=s; editCls=c;
  document.getElementById('editModalTitle').textContent=c+' 학생 편집';
  document.getElementById('addStudentName').value='';
  renderSmList();
  document.getElementById('editModal').classList.add('show');
}
function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  if (editSes===ses && editCls===cur) renderGrid();
  renderCmLists(); save();
}
function renderSmList() {
  const students = D[editSes]?.[editCls]||[];
  const el = document.getElementById('smList');
  if (!students.length) { el.innerHTML=`<div style="text-align:center;color:var(--tx3);font-size:13px;padding:12px 0">학생 없음</div>`; return; }
  el.innerHTML = students.map((n,i)=>
    n ? `<div class="sm-row"><div class="sm-num">${i+1}</div><div class="sm-name">${n}</div><button class="sm-del" onclick="delStudent(${i})"><i class="ti ti-x"></i></button></div>`
      : `<div class="sm-row" style="opacity:.4"><div class="sm-num">${i+1}</div><div class="sm-name" style="color:var(--tx3)">결번</div></div>`
  ).join('');
}
function addStudent() {
  const inp = document.getElementById('addStudentName');
  const name = inp.value.trim(); if (!name) return;
  if (!D[editSes][editCls]) D[editSes][editCls]=[];
  D[editSes][editCls].push(name);
  inp.value=''; renderSmList(); inp.focus();
}
function delStudent(i) {
  // 삭제 대신 결번 처리 (번호 유지)
  if (!confirm(`${i+1}번 ${D[editSes][editCls][i]} 삭제(결번 처리)하시겠습니까?`)) return;
  D[editSes][editCls][i] = '';  // 빈 문자열 = 결번
  if (A[editSes]?.[editCls]) delete A[editSes][editCls][i];
  if (M[editSes]?.[editCls]) delete M[editSes][editCls][i];
  renderSmList();
}

// ── 설정 ──
function openSettings() {
  document.getElementById('settingsUrl').value=localStorage.getItem('scriptUrl')||'';
  renderCmLists();
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('show'); }
function saveUrl() {
  const url=document.getElementById('settingsUrl').value.trim();
  localStorage.setItem('scriptUrl', url);
  toast('URL 저장','ok');
  closeSettings();
}
function renderCmLists() {
  ['morning','class'].forEach(s=>{
    const el=document.getElementById('cm'+s[0].toUpperCase()+s.slice(1));
    const list=Object.keys(D[s]||{});
    if(!list.length){el.innerHTML=`<div style="font-size:13px;color:var(--tx3);padding:4px 0">반 없음</div>`;return;}
    el.innerHTML=list.map(c=>`
      <div class="cm-item">
        <div class="cm-info"><div class="cm-name">${c}</div><div class="cm-meta">${(D[s][c]||[]).filter(n=>n).length}명</div></div>
        <div class="cm-btns">
          <button class="cm-edit" title="시트에서 명단 불러오기" onclick="loadStudentsFromSheet('${esc(s)}','${esc(c)}')"><i class="ti ti-download"></i></button>
          <button class="cm-edit" onclick="openEditModal('${esc(s)}','${esc(c)}')"><i class="ti ti-pencil"></i></button>
          <button class="cm-del" onclick="delClass('${esc(s)}','${esc(c)}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>`).join('');
  });
}
function delClass(s,c) {
  if(!confirm(`'${c}' 삭제?`))return;
  delete D[s][c]; if(A[s])delete A[s][c]; if(M[s])delete M[s][c];
  if(s===ses&&c===cur){cur=Object.keys(D[s])[0]||'';renderTabs();renderGrid();}
  renderCmLists(); save();
}

// ── 시트 저장 ──
async function saveAttendance(){
  const url = getUrl();
  const students=D[ses]?.[cur]||[];
  const a=A[ses]?.[cur]||{};
  const m=M[ses]?.[cur]||{};
  const records=students
    .map((name,i)=>({name, status:LABEL[a[i]]||'미입력', memo:m[i]||''}))
    .filter(r=>r.name); // 결번 제외
  const btn=document.getElementById('saveBtn');
  btn.disabled=true; btn.innerHTML='<i class="ti ti-loader" style="font-size:15px"></i> 저장 중...';
  try{
    const res=await fetch(url,{method:'POST',body:JSON.stringify({
      action:'saveAttendance',session:ses,class:cur,date:todayKey(),records
    })});
    const r=await res.json();
    toast(r.message||'저장 완료 ✓','ok');
    setSyncStatus('synced','저장됨');
  }catch{
    toast('저장 실패 — URL 확인','err');
    setSyncStatus('error','저장 실패');
  }finally{
    btn.disabled=false;
    btn.innerHTML='<i class="ti ti-device-floppy" style="font-size:15px"></i> 시트 저장';
  }
}

// ── 시트에서 불러오기 ──
async function syncFromSheet(){
  const url = getUrl();
  if(!url) { toast('URL이 설정되지 않았습니다','err'); return; }

  const btn = document.getElementById('loadBtn');
  if(btn) btn.querySelector('i').style.transform='rotate(360deg)';
  setSyncStatus('syncing','불러오는 중...');

  try{
    // 1. 학생 명단이 비어있으면 먼저 명단 불러오기
    if(!(D[ses]?.[cur]||[]).filter(n=>n).length) {
      const pS = new URLSearchParams({ action:'getStudents', session:ses, class:cur });
      const rS = await (await fetch(`${url}?${pS}`)).json();
      if(rS.students?.length) {
        if(!D[ses]) D[ses]={};
        D[ses][cur] = rS.students;
        if(!A[ses]) A[ses]={}; if(!A[ses][cur]) A[ses][cur]={};
        if(!M[ses]) M[ses]={}; if(!M[ses][cur]) M[ses][cur]={};
      }
    }

    // 2. 출석 데이터 불러오기
    const students = D[ses]?.[cur]||[];
    const params = new URLSearchParams({
      action:'getAttendance', session:ses, class:cur, date:todayKey()
    });
    const r = await (await fetch(`${url}?${params}`)).json();

    if(!r.records || !r.records.length){
      // 오늘 날짜면 출석 초기화, 과거 날짜면 그냥 빈 상태로
      if(!A[ses]) A[ses]={}; A[ses][cur]={};
      if(!M[ses]) M[ses]={}; M[ses][cur]={};
      save(); renderGrid();
      setSyncStatus('idle', isToday(selectedDate) ? '오늘 출석 없음' : '해당 날짜 데이터 없음');
      toast(isToday(selectedDate) ? '오늘 출석 데이터 없음 (초기화됨)' : '해당 날짜 데이터 없음');
      return;
    }

    if(!A[ses]) A[ses]={}; if(!A[ses][cur]) A[ses][cur]={};
    if(!M[ses]) M[ses]={}; if(!M[ses][cur]) M[ses][cur]={};

    const statusMap={'출석':'present','결석':'absent','지각':'late','조퇴':'early'};
    r.records.forEach(rec=>{
      const idx = students.indexOf(rec.name);
      if(idx===-1) return;
      if(rec.status && statusMap[rec.status]) A[ses][cur][idx]=statusMap[rec.status];
      else delete A[ses][cur][idx];
      if(rec.memo) M[ses][cur][idx]=rec.memo;
      else delete M[ses][cur][idx];
    });

    save(); renderGrid();
    const now = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('synced',`${now} 불러옴`);
    toast('불러오기 완료 ✓','ok');
  }catch(e){
    setSyncStatus('error','불러오기 실패');
    toast('불러오기 실패 — 연결 확인','err');
  }finally{
    if(btn) btn.querySelector('i').style.transform='';
  }
}

function setSyncStatus(status, label=''){
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  if(!dot) return;
  const colors = {idle:'var(--tx3)', syncing:'#EF9F27', synced:'var(--present-badge)', error:'var(--absent-badge)'};
  dot.style.background = colors[status]||colors.idle;
  if(lbl) lbl.textContent = label;
}

// 학번+이름 분리 (예: "30106 이봄" → {num:"30106", name:"이봄"})
function parseName(raw) {
  if (!raw) return {num:'', name:''};
  const m = raw.match(/^(\d+)\s+(.+)$/);
  if (m) return {num: m[1], name: m[2]};
  return {num:'', name: raw};
}

// ── 시트에서 학생 명단 불러오기 ──
async function loadStudentsFromSheet(s, c) {
  const url = getUrl();
  toast('명단 불러오는 중...','');
  try {
    const params = new URLSearchParams({ action:'getStudents', session:s, class:c });
    const res = await fetch(`${url}?${params}`);
    const r = await res.json();
    if (!r.students || !r.students.length) {
      toast('시트에 학생 데이터 없음','err'); return;
    }
    D[s][c] = r.students;
    if (!A[s][c]) A[s][c] = {};
    if (!M[s][c]) M[s][c] = {};
    save();
    renderCmLists();
    if (s===ses && c===cur) renderGrid();
    toast(`${c} ${r.students.filter(n=>n).length}명 불러옴 ✓`, 'ok');
  } catch {
    toast('불러오기 실패', 'err');
  }
}
async function openLateStats() {
  document.getElementById('lateStatsOverlay').classList.add('show');
  const body = document.getElementById('lateStatsBody');
  body.innerHTML = `<div class="ls-empty">불러오는 중...</div>`;

  const url = getUrl();
  const cls = Object.keys(D.morning)[0] || '3-1(아침자습)';
  try {
    const res = await fetch(`${url}?action=getAllAttendance&session=morning&class=${encodeURIComponent(cls)}`);
    const r = await res.json();
    renderLateStats(r.dates || {});
  } catch {
    body.innerHTML = `<div class="ls-empty">불러오기 실패<br>시트에 저장된 데이터가 있는지 확인하세요</div>`;
  }
}

function closeLateStats() {
  document.getElementById('lateStatsOverlay').classList.remove('show');
}

function renderLateStats(dates) {
  const body = document.getElementById('lateStatsBody');
  const students = D.morning?.[Object.keys(D.morning)[0]] || [];

  // 학생별 지각 횟수 집계
  const lateCount = {};
  students.forEach(n => lateCount[n] = 0);
  const dateKeys = Object.keys(dates).sort((a,b) => {
    const [am,ad] = a.split('/').map(Number);
    const [bm,bd] = b.split('/').map(Number);
    return am!==bm ? am-bm : ad-bd;
  });

  // 총 지각 횟수
  let totalLate = 0;
  dateKeys.forEach(dk => {
    (dates[dk]||[]).forEach(r => {
      if (r.status==='지각') { lateCount[r.name]=(lateCount[r.name]||0)+1; totalLate++; }
    });
  });

  const lateStudents = students.filter(n => lateCount[n]>0).sort((a,b)=>lateCount[b]-lateCount[a]);

  let html = `
    <div class="ls-summary">
      <div class="ls-sum-card"><div class="ls-sum-num">${totalLate}</div><div class="ls-sum-label">총 지각 건수</div></div>
      <div class="ls-sum-card"><div class="ls-sum-num">${lateStudents.length}</div><div class="ls-sum-label">지각 경험 학생</div></div>
      <div class="ls-sum-card"><div class="ls-sum-num">${dateKeys.length}</div><div class="ls-sum-label">기록된 날짜</div></div>
    </div>`;

  if (!lateStudents.length) {
    html += `<div class="ls-empty">아직 지각 기록이 없어요 ✨</div>`;
  } else {
    // 학생별 지각 횟수 목록
    html += `<div style="font-size:12px;color:var(--tx3);font-weight:700;margin-bottom:8px">학생별 지각 횟수</div>`;
    lateStudents.forEach(name => {
      const idx = students.indexOf(name);
      const memos = [];
      dateKeys.forEach(dk => {
        const rec = (dates[dk]||[]).find(r=>r.name===name && r.status==='지각');
        if (rec && rec.memo) memos.push(`${dk}: ${rec.memo}`);
      });
      html += `<div class="ls-student-row">
        <div class="ls-student-num">${String(idx+1).padStart(2,'0')}</div>
        <div class="ls-student-name">${name}</div>
        ${memos.length ? `<div class="ls-student-memo" title="${memos.join('\n')}">${memos[memos.length-1]}</div>` : ''}
        <span class="ls-count-badge">${lateCount[name]}회</span>
      </div>`;
    });

    // 날짜별 지각자 목록
    html += `<div style="font-size:12px;color:var(--tx3);font-weight:700;margin:14px 0 8px">날짜별 지각 현황</div>`;
    dateKeys.forEach(dk => {
      const lates = (dates[dk]||[]).filter(r=>r.status==='지각');
      if (!lates.length) return;
      html += `<div class="ls-date-section">
        <div class="ls-date-label">${dk} <span class="ls-count-badge">${lates.length}명</span></div>`;
      lates.forEach(r => {
        const idx = students.indexOf(r.name);
        html += `<div class="ls-student-row">
          <div class="ls-student-num">${idx>=0?String(idx+1).padStart(2,'0'):'-'}</div>
          <div class="ls-student-name">${r.name}</div>
          <div class="ls-student-memo">${r.memo||''}</div>
        </div>`;
      });
      html += `</div>`;
    });
  }

  body.innerHTML = html;
}

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast ${type} show`;
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

function esc(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function hardReset() {
  if (!confirm('앱 데이터를 완전히 초기화하시겠습니까?\n반 명단과 출석 기록이 모두 삭제됩니다.\n(구글 시트 데이터는 유지됩니다)')) return;
  ['att5','att4','att3'].forEach(k => localStorage.removeItem(k));
  reset();
  closeSettings();
  renderTabs(); renderGrid();
  toast('초기화 완료 — 설정에서 반 명단을 불러오세요', 'ok');
}

// ── PWA 설치 ──
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});

window.addEventListener('appinstalled', () => {
  closePwaBanner();
  deferredPrompt = null;
  toast('앱 설치 완료!', 'ok');
});

async function installPWA() {
  // iOS Safari 감지
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

  if (isIOS || isSafari) {
    // iOS는 직접 설치 불가 → 안내
    showIOSGuide();
    return;
  }

  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      closePwaBanner();
      toast('앱 설치 완료!', 'ok');
    }
    deferredPrompt = null;
  } else {
    // 이미 설치됐거나 Chrome 아닌 경우
    showIOSGuide();
  }
}

function showIOSGuide() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS) {
    toast('Safari → 하단 공유(□↑) → 홈 화면에 추가', 'ok');
  } else {
    toast('Chrome 주소창 오른쪽 ⊕ 버튼 → 설치', 'ok');
  }
}

function closePwaBanner() {
  document.getElementById('pwaBanner').classList.remove('show');
  localStorage.setItem('pwaDismissed', '1');
}

function showPwaBanner() {
  document.getElementById('pwaBanner').classList.add('show');
}

if('serviceWorker'in navigator)navigator.serviceWorker.register('/checkAttendance/sw.js').catch(()=>{});
init();
